<html>
  <head>
    <title>Minha segunda experiência de RA usando AR.js e o AFrame, com marcador Hiro e imagem.</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  
  <body style="margin: 0 px; overflow: hidden">
    <a-scene vr-mode-ui="enabled: false" embedded arjs="debugUIEnabled: false">
      <a-marker present="hiro">
        <a-image>src="bandeira.png"</a-image>
      </a-marker>a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
  
</html>
